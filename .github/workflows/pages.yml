name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pages 已在仓库设置中启用（Source: GitHub Actions），此处只需读取站点配置。
      # 不使用 enablement: true —— GITHUB_TOKEN 无权创建/修改 Pages 站点，
      # 该输入只会在站点配置漂移时把部署硬失败掉。
      - uses: actions/configure-pages@v5
      - name: Prepare artifact
        run: touch .nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
